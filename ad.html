<!DOCTYPE html>
<html>
<head>
    <title>Ad Test Page</title>
    <style>
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: white;
            margin: 100px auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
        }
        #adcontainer {
            width: 300px;
            height: 250px;
            margin: 20px auto;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<button onclick="showModal('Test', 'Ad Display Test')">Show Modal</button>

<div id="modal">
    <div class="modal-content">
        <h2 id="modalTitle"></h2>
        <p id="modalMessage"></p>
        <div id="adcontainer"></div>
        <button onclick="document.getElementById('modal').style.display='none'">Close</button>
    </div>
</div>

<script>
function showModal(title, message) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modal').style.display = 'block';

    // Ad container को रीसेट करें
    const adcontainer = document.getElementById('adcontainer');
    adcontainer.innerHTML = '<div style="padding:20px;text-align:center">Loading advertisement...</div>';

    // AdBlocker चेक
    if(typeof window.adsvictory_display === 'undefined') {
        adcontainer.innerHTML = `
            <div style="color:red;padding:20px;text-align:center">
                <p>AdBlocker detected!</p>
                <p>Please disable ad blocker to support us</p>
                <img src="https://via.placeholder.com/300x250?text=Ad+Placeholder" alt="Ad Placeholder">
            </div>
        `;
        return;
    }

    // AdsVictory कोड
    const script1 = document.createElement('script');
    script1.src = 'https://serve.adsvictory.site/tag.js';
    script1.async = true;
    
    const script2 = document.createElement('script');
    script2.textContent = `
        window.adsvictory_display = window.adsvictory_display || [];
        var a_display_preferences = {
            zone: "uIYOr4F77kLK",
            width: "300",
            height: "250",
            type: "Banner"
        };
        adsvictory_display.push(a_display_preferences);
    `;
    
    adcontainer.innerHTML = '<div class="adsvictory" data-zone="A-uIYOr4F77kLK"></div>';
    document.body.appendChild(script1);
    document.body.appendChild(script2);
}
</script>

</body>
</html>
