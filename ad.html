<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ad Test Page</title>
    <style>
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            margin: 100px auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        #adcontainer {
            width: 300px;
            height: 250px;
            margin: 20px auto;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<button onclick="showModal('Test', 'Ad Display Test')">Show Modal</button>

<div id="modal">
    <div class="modal-content">
        <h2 id="modalTitle"></h2>
        <p id="modalMessage"></p>
        <div id="adcontainer"></div>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
function showModal(title, message) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modal').style.display = 'block';

    const adcontainer = document.getElementById('adcontainer');
    adcontainer.innerHTML = '<div style="padding:20px;text-align:center">Loading advertisement...</div>';

    // Check if ad blocker is enabled by trying to load script
    const testScript = document.createElement('script');
    testScript.src = 'https://serve.adsvictory.site/tag.js';
    testScript.async = true;

    testScript.onload = () => {
        adcontainer.innerHTML = '<div class="adsvictory" data-zone="A-uIYOr4F77kLK"></div>';

        const inlineScript = document.createElement('script');
        inlineScript.textContent = `
            window.adsvictory_display = window.adsvictory_display || [];
            window.adsvictory_display.push({
                zone: "uIYOr4F77kLK",
                width: "300",
                height: "250",
                type: "Banner"
            });
        `;
        document.body.appendChild(inlineScript);
    };

    testScript.onerror = () => {
        adcontainer.innerHTML = `
            <div style="color:red;padding:20px;text-align:center">
                <p>AdBlocker detected!</p>
                <p>Please disable ad blocker to support us</p>
                <img src="https://via.placeholder.com/300x250?text=Ad+Placeholder" alt="Ad Placeholder">
            </div>
        `;
    };

    document.body.appendChild(testScript);
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}
</script>

</body>
</html>
