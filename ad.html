<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Font Preview Tool</title>

  <!-- AdSense का script (एक बार) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3260626041201461"
    crossorigin="anonymous"></script>

  <style>
    /* अपनी जरूरत के स्टाइल यहाँ लिखो */
  </style>
</head>
<body>

<!-- AdSense का Display Block (एक बार) -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-3260626041201461"
     data-ad-slot="8503391102"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- Modal Structure -->
<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
  <div style="background:white; margin:100px auto; padding:20px; width:90%; max-width:500px; position:relative;">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <div id="adcontainer" style="margin-top:20px;"></div>
    <button onclick="closeModal()" style="margin-top:20px;">Close</button>
  </div>
</div>

<!-- बाकी आपका main content -->

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalMessage = document.getElementById('modal-message');
const adcontainer = document.getElementById('adcontainer');

// Modal Open Function
function showModal(title, message) {
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modal.style.display = 'block';

    // हर बार adcontainer खाली करो
    adcontainer.innerHTML = '';

    // Matloom/Advictory Ad Code
    const advScriptOptions = document.createElement('script');
    advScriptOptions.type = 'text/javascript';
    advScriptOptions.innerHTML = `
        atOptions = {
            'key' : '00171124b49d47b0ffd09b62928d1616',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
        };
    `;
    const advScriptInvoke = document.createElement('script');
    advScriptInvoke.type = 'text/javascript';
    advScriptInvoke.src = '//matloomreconcile.com/00171124b49d47b0ffd09b62928d1616/invoke.js';

    adcontainer.appendChild(advScriptOptions);
    adcontainer.appendChild(advScriptInvoke);
}

// Modal Close Function
function closeModal() {
    modal.style.display = 'none';
}

// Modal के बाहर क्लिक पर बंद करना
window.onclick = function(event) {
  if (event.target == modal) {
    closeModal();
  }
}

</script>

</body>
</html>
